[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-discord-rpc"
version = "0.1.1"
description = "Discord Rich Presence companion for Codex CLI"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Codex Discord RPC contributors" }]
dependencies = []

[project.scripts]
codex-rpc = "codex_discord_rpc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.codex-discord-rpc]
# This project intentionally has no third-party runtime dependencies.
