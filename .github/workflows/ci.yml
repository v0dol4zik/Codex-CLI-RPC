name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go test and audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Check test coverage
        run: go test -cover ./...

      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /tmp/codex-rpc ./cmd/codex-rpc

      - name: Check shell syntax
        run: bash -n scripts/*.sh

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      - name: Test isolated installation
        run: bash scripts/test-install.sh

      - name: Check public files for secrets
        run: bash scripts/check-public-repo.sh

      - name: Validate user unit
        run: systemd-analyze verify systemd/codex-discord-rpc.service
