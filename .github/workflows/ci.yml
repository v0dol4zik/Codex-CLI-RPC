name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lint tools
        run: python -m pip install "ruff==0.12.12"

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m compileall -q src bin

      - name: Lint Python
        run: ruff check src tests

      - name: Check shell syntax
        run: bash -n scripts/install.sh scripts/uninstall.sh scripts/check-public-repo.sh

      - name: Lint shell script
        run: shellcheck scripts/install.sh scripts/uninstall.sh scripts/check-public-repo.sh

      - name: Check public files for secrets
        run: bash scripts/check-public-repo.sh

      - name: Validate service file
        run: |
          test -s systemd/codex-discord-rpc.service
          grep -qx '\[Unit\]' systemd/codex-discord-rpc.service
          grep -qx '\[Service\]' systemd/codex-discord-rpc.service
          grep -qx '\[Install\]' systemd/codex-discord-rpc.service
          grep -q '^ExecStart=.*codex-rpc --monitor$' systemd/codex-discord-rpc.service
